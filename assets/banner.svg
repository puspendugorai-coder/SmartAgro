<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" width="900" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a0f"/>
      <stop offset="50%" style="stop-color:#0d2414"/>
      <stop offset="100%" style="stop-color:#0f2e1a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80">
        <animate attributeName="offset" values="0%;60%;0%" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#86efac">
        <animate attributeName="offset" values="50%;100%;50%" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#22c55e">
        <animate attributeName="offset" values="100%;160%;100%" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="50%" style="stop-color:#4ade80;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <clipPath id="bannerClip">
      <rect width="900" height="280" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="16" fill="url(#bgGrad)"/>

  <g clip-path="url(#bannerClip)">

    <!-- Grid lines horizontal -->
    <g stroke="#22c55e" stroke-width="0.5" opacity="0.07">
      <line x1="0" y1="40" x2="900" y2="40"/>
      <line x1="0" y1="80" x2="900" y2="80"/>
      <line x1="0" y1="120" x2="900" y2="120"/>
      <line x1="0" y1="160" x2="900" y2="160"/>
      <line x1="0" y1="200" x2="900" y2="200"/>
      <line x1="0" y1="240" x2="900" y2="240"/>
    </g>
    <!-- Grid lines vertical -->
    <g stroke="#22c55e" stroke-width="0.5" opacity="0.07">
      <line x1="60" y1="0" x2="60" y2="280"/>
      <line x1="120" y1="0" x2="120" y2="280"/>
      <line x1="180" y1="0" x2="180" y2="280"/>
      <line x1="240" y1="0" x2="240" y2="280"/>
      <line x1="300" y1="0" x2="300" y2="280"/>
      <line x1="360" y1="0" x2="360" y2="280"/>
      <line x1="420" y1="0" x2="420" y2="280"/>
      <line x1="480" y1="0" x2="480" y2="280"/>
      <line x1="540" y1="0" x2="540" y2="280"/>
      <line x1="600" y1="0" x2="600" y2="280"/>
      <line x1="660" y1="0" x2="660" y2="280"/>
      <line x1="720" y1="0" x2="720" y2="280"/>
      <line x1="780" y1="0" x2="780" y2="280"/>
      <line x1="840" y1="0" x2="840" y2="280"/>
    </g>

    <!-- Glow orb left -->
    <ellipse cx="80" cy="100" rx="180" ry="160" fill="#16a34a" opacity="0.18">
      <animate attributeName="opacity" values="0.12;0.22;0.12" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="180;200;180" dur="6s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Glow orb right -->
    <ellipse cx="820" cy="200" rx="140" ry="120" fill="#15803d" opacity="0.15">
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="8s" begin="3s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Scan line -->
    <rect x="0" y="0" width="900" height="2" fill="url(#scanGrad)">
      <animate attributeName="y" values="-2;282" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- Floating particles -->
    <circle cx="120" cy="240" r="2" fill="#4ade80" opacity="0">
      <animate attributeName="cy" values="240;100" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="260" r="1.5" fill="#4ade80" opacity="0">
      <animate attributeName="cy" values="260;120" dur="6s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0" dur="6s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="250" r="2" fill="#4ade80" opacity="0">
      <animate attributeName="cy" values="250;80" dur="7s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" dur="7s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="270" r="1.5" fill="#4ade80" opacity="0">
      <animate attributeName="cy" values="270;100" dur="5.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0" dur="5.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="265" r="1.5" fill="#86efac" opacity="0">
      <animate attributeName="cy" values="265;90" dur="6.5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0.4;0" dur="6.5s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="255" r="2" fill="#4ade80" opacity="0">
      <animate attributeName="cy" values="255;70" dur="7.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" dur="7.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Data ping dots -->
    <circle cx="160" cy="60" r="3" fill="#4ade80" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;8;3" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="80" r="3" fill="#4ade80" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="4s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;8;3" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="180" r="3" fill="#4ade80" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;8;3" dur="4s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="220" r="3" fill="#4ade80" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="4s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;8;3" dur="4s" begin="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Corner accents -->
    <path d="M20,40 L20,20 L40,20" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.4"/>
    <path d="M860,20 L880,20 L880,40" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.4"/>
    <path d="M20,240 L20,260 L40,260" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.4"/>
    <path d="M860,260 L880,260 L880,240" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.4"/>

    <!-- Logo ring -->
    <circle cx="450" cy="68" r="26" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="26;28;26" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="68" r="32" fill="none" stroke="#4ade80" stroke-width="0.8" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="68" r="38" fill="none" stroke="#4ade80" stroke-width="0.5" opacity="0.1">
      <animate attributeName="opacity" values="0.05;0.15;0.05" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>

    <!-- Leaf icon -->
    <text x="450" y="76" text-anchor="middle" font-size="22" font-family="serif">
      🌿
      <animateTransform attributeName="transform" type="rotate" values="-5,450,68;5,450,68;-5,450,68" dur="4s" repeatCount="indefinite"/>
    </text>

    <!-- SmartAgro main title -->
    <text x="450" y="135" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="52" font-weight="900"
          fill="url(#textGrad)"
          letter-spacing="-1">
      SmartAgro
      <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
    </text>

    <!-- Subtitle -->
    <text x="450" y="158" text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="10" font-weight="500"
          fill="#4ade80" opacity="0.65"
          letter-spacing="4">
      PRECISION AGRICULTURE PLATFORM
      <animate attributeName="opacity" values="0;0.65" dur="0.8s" begin="0.3s" fill="freeze"/>
    </text>

    <!-- Tagline -->
    <text x="450" y="183" text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="12" font-weight="300"
          fill="white" opacity="0.5">
      Empowering India's farmers with AI-powered intelligence
      <animate attributeName="opacity" values="0;0.5" dur="0.8s" begin="0.6s" fill="freeze"/>
    </text>

    <!-- Badge row -->
    <!-- Python badge -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.9s" fill="freeze"/>
      <rect x="176" y="202" width="92" height="24" rx="12" fill="#3776AB" fill-opacity="0.2" stroke="#3776AB" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="222" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#93c5fd">🐍 Python 3.11+</text>
    </g>

    <!-- Flask badge -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.0s" fill="freeze"/>
      <rect x="278" y="202" width="76" height="24" rx="12" fill="white" fill-opacity="0.07" stroke="white" stroke-width="0.8" stroke-opacity="0.25"/>
      <text x="316" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#e2e8f0">⚗️ Flask 3.0</text>
    </g>

    <!-- Render badge -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.1s" fill="freeze"/>
      <rect x="364" y="202" width="100" height="24" rx="12" fill="#16a34a" fill-opacity="0.2" stroke="#4ade80" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="414" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#86efac">🚀 On Render</text>
    </g>

    <!-- MIT badge -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>
      <rect x="474" y="202" width="78" height="24" rx="12" fill="#b45309" fill-opacity="0.15" stroke="#fbbf24" stroke-width="0.8" stroke-opacity="0.35"/>
      <text x="513" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#fcd34d">📄 MIT License</text>
    </g>

    <!-- India badge -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.3s" fill="freeze"/>
      <rect x="562" y="202" width="96" height="24" rx="12" fill="#c2410c" fill-opacity="0.15" stroke="#fb923c" stroke-width="0.8" stroke-opacity="0.35"/>
      <text x="610" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#fdba74">🇮🇳 Made for India</text>
    </g>

    <!-- Bottom tagline -->
    <text x="450" y="252" text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="10" fill="#4ade80" opacity="0.35"
          letter-spacing="2">
      Built with ❤️ for India's 140 million farmers
    </text>

  </g>
</svg>